# ╔════════════════════════════════════════════════════════════════╗
# ║                    Spotifyd Configuration                      ║
# ╚════════════════════════════════════════════════════════════════╝
# This is a background Spotify daemon that acts as a Spotify Connect device

[global]
# Device name shown in Spotify Connect
device_name = "MacBook-Spotifyd"

# Audio backend for macOS
backend = "portaudio"

# Audio quality (96, 160, 320 for premium)
bitrate = 320

# Volume controller
volume_controller = "softvol"

# Initial volume (0-100)
initial_volume = "70"

# Cache for offline playback
cache_path = "/Users/JXET3RQ/.cache/spotifyd"

# Don't need username/password - uses Spotify Connect discovery
# The spotify_player or Spotify app will find this device
